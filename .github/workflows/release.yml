name: Release

# Pushing a tag like v0.3.0 publishes the store, updater and demo images (x64 and arm64), the release the admin offers as an
# update, the site and the public demo.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # `bun run release` already ran `bun run check` on this commit, and CI ran it on main.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: app
        with:
          file: deploy/Dockerfile
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
      - uses: docker/build-push-action@v6
        id: updater
        with:
          file: deploy/Dockerfile.updater
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-updater:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}-updater:latest
      # The demo job below deploys this image to the public demo once the release is out.
      - uses: docker/build-push-action@v6
        with:
          file: deploy/Dockerfile
          target: demo
          cache-from: type=gha,scope=app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}-demo:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}-demo:latest
      # The installer and the updater pull the image by this digest, so one changed in the registry later is refused.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          printf 'app=%s\nupdater=%s\n' "$APP_DIGEST" "$UPDATER_DIGEST" > images.txt
          grep -Eq '^app=sha256:[0-9a-f]{64}$' images.txt
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag images.txt

  # librefunnel.com serves /install from the latest release, so the site goes out right after it.
  site:
    needs: release
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish the site."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - working-directory: site
        run: bun install --frozen-lockfile && bun run build
      - working-directory: site
        run: bunx wrangler@4.162.0 pages deploy out --project-name librefunnel --branch main

  # The public demo follows every release, like the site: over SSH with a key the server pins to deploy/demo-deploy.sh.
  demo:
    needs: release
    runs-on: ubuntu-latest
    env:
      DEMO_SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
      DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
      DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
    steps:
      - name: Demo secrets
        run: |
          if [ -z "$DEMO_SSH_HOST" ] || [ -z "$DEMO_SSH_KEY" ] || [ -z "$DEMO_SSH_KNOWN_HOSTS" ]; then
            echo "::error::Set the DEMO_SSH_HOST, DEMO_SSH_KEY and DEMO_SSH_KNOWN_HOSTS repository secrets to deploy the demo (README, Demo)."
            exit 1
          fi
      - name: Deploy the demo
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEMO_SSH_KEY" > ~/.ssh/demo
          chmod 600 ~/.ssh/demo
          printf '%s\n' "$DEMO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/demo -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEMO_SSH_HOST" "$GITHUB_REF_NAME"
