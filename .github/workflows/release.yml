name: Release

# Pushing a tag like v0.3.0 publishes the store, updater and demo images (x64 and arm64), the release the admin offers as an
# update, the site and the public demo.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # `bun run release` already ran `bun run check` on this commit, and CI ran it on main.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: app
        with:
          file: deploy/Dockerfile
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
      - uses: docker/build-push-action@v6
        id: updater
        with:
          file: deploy/Dockerfile.updater
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-updater:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}-updater:latest
      # The demo job below deploys this image to the public demo once the release is out.
      - uses: docker/build-push-action@v6
        with:
          file: deploy/Dockerfile
          target: demo
          cache-from: type=gha,scope=app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}-demo:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}-demo:latest
      # The installer and the updater pull the image by this digest, so one changed in the registry later is refused.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          printf 'app=%s\nupdater=%s\n' "$APP_DIGEST" "$UPDATER_DIGEST" > images.txt
          grep -Eq '^app=sha256:[0-9a-f]{64}$' images.txt
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag images.txt

  # librefunnel.com serves /install from the latest release, so the site goes out right after it.
  site:
    needs: release
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish the site."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - working-directory: site
        run: bun install --frozen-lockfile && bun run build
      - working-directory: site
        run: bunx wrangler@4.162.0 pages deploy out --project-name librefunnel --branch main

  # The public demo follows every release, like the site. Oracle Cloud's Run Command carries the deploy, so the demo
  # server opens no port: its agent fetches the command, runs deploy/demo-deploy.sh and reports the output here.
  demo:
    needs: release
    runs-on: ubuntu-latest
    env:
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      SUPPRESS_LABEL_WARNING: "True"
      DEMO_INSTANCE_ID: ${{ secrets.DEMO_INSTANCE_ID }}
      DEMO_COMPARTMENT_ID: ${{ secrets.DEMO_COMPARTMENT_ID }}
    steps:
      - name: Demo secrets
        run: |
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_KEY OCI_REGION DEMO_INSTANCE_ID DEMO_COMPARTMENT_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Set the $name repository secret to deploy the demo (README, Demo)."
              exit 1
            fi
          done
      - name: Oracle Cloud CLI
        run: |
          pipx install oci-cli==3.90.2
          install -m 700 -d ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" "$OCI_REGION" ~/.oci/key.pem > ~/.oci/config
          chmod 600 ~/.oci/config
      - name: Deploy the demo
        run: |
          content=$(jq -nc --arg text "sudo /opt/librefunnel/demo-deploy.sh $GITHUB_REF_NAME" \
            '{source: {sourceType: "TEXT", text: $text}, output: {outputType: "TEXT"}}')
          command=$(oci instance-agent command create --compartment-id "$DEMO_COMPARTMENT_ID" \
            --target "{\"instanceId\": \"$DEMO_INSTANCE_ID\"}" --content "$content" --timeout-in-seconds 600 \
            --display-name "deploy $GITHUB_REF_NAME" --query data.id --raw-output)
          for _ in $(seq 1 80); do
            state=$(oci instance-agent command-execution get --command-id "$command" --instance-id "$DEMO_INSTANCE_ID" \
              --query 'data."lifecycle-state"' --raw-output)
            case $state in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;; esac
            sleep 10
          done
          oci instance-agent command-execution get --command-id "$command" --instance-id "$DEMO_INSTANCE_ID" \
            --query data.content.text --raw-output
          test "$state" = SUCCEEDED
