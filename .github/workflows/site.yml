name: Site

# librefunnel.com goes out on every push that changes site/, and after every release (release.yml calls this), so a
# fix to the site never waits for, or forces, a new store version.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Two pushes close together: only the newer site goes out.
    concurrency:
      group: site
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish the site."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # /install downloads the files of the latest published release, so it is served as that release has it, never from
      # main or from a tag whose release is still being built.
      - name: Installers of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          git checkout "$tag" -- deploy/install.sh deploy/install.ps1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - working-directory: site
        run: bun install --frozen-lockfile && bun run build
      - working-directory: site
        run: bunx wrangler@4.162.0 pages deploy out --project-name librefunnel --branch main
