# Public demo only (DEMO_MODE=1 in .env): the image's demo target, which adds the demo/ seeds and media.
# Each release publishes it and deploys it to the demo server (deploy/demo-deploy.sh, see README). To build locally:
# docker compose -f compose.yaml -f compose.demo.yaml up -d --build app db caddy
services:
  app:
    image: ghcr.io/toledosdl/librefunnel-demo:latest
    build:
      target: demo
    # The demo runs no updater and no Evolution: an address would only make the admin wait for them.
    environment:
      UPDATER_URL: ""
      EVOLUTION_URL: ""
