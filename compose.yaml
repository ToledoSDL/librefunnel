# Docker keeps every log line forever by default, which fills a small disk and stops the database. 3 x 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    # Updates swap this image; everything the store saved lives in the volumes below and in .env.
    # With LIBREFUNNEL_DIGEST (images.txt of the release) Docker refuses an image changed in the registry after publishing.
    image: ghcr.io/toledosdl/librefunnel:${LIBREFUNNEL_VERSION:-latest}${LIBREFUNNEL_DIGEST:+@}${LIBREFUNNEL_DIGEST:-}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      TZ: America/Sao_Paulo
      EVOLUTION_URL: ${EVOLUTION_URL:-http://evolution:8080}
      EVOLUTION_KEY: ${EVOLUTION_KEY:-${POSTGRES_PASSWORD}}
      UPDATER_URL: http://updater:8090
      UPDATER_TOKEN: ${UPDATER_TOKEN:-${POSTGRES_PASSWORD}}
      DATABASE_URL: postgresql://librefunnel:${POSTGRES_PASSWORD}@db:5432/librefunnel
      BACKUP_DIR: /backups
      # Set only by deploy/install.sh for one start, to connect R2; never written to .env.
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
    volumes:
      - data:/data
      # Read only: the app copies the daily dump to the connected bucket.
      - backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Checked every 2 s while starting, so an update switches to the new container as soon as it answers.
      start_period: 3m
      start_interval: 2s
    logging: *logging

  db:
    logging: *logging
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: librefunnel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: librefunnel
      # Read by deploy/evolution.sql when the database is first created.
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/evolution.sql:/docker-entrypoint-initdb.d/evolution.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "librefunnel", "-d", "librefunnel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    logging: *logging
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: librefunnel
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: librefunnel
    volumes:
      - backups:/backups
    # One dump a day named after the weekday (1 is Monday), so the last 7 days are kept.
    entrypoint:
      - sh
      - -c
      - while true; do pg_dump --clean --if-exists --no-owner -f /backups/partial.sql && mv /backups/partial.sql /backups/librefunnel-$$(date +%u).sql; sleep 86400; done
    depends_on:
      db:
        condition: service_healthy

  caddy:
    logging: *logging
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  evolution:
    logging: *logging
    # Off until WhatsApp is connected in the admin, which turns it on through the updater: it uses about 300 MB.
    profiles: [whatsapp]
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution:8080
      # The installer sets its own key; stores installed before that use the database password.
      AUTHENTICATION_API_KEY: ${EVOLUTION_KEY:-${POSTGRES_PASSWORD}}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      # Its own user on stores installed with EVOLUTION_DB_PASSWORD; older stores keep the store's user.
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_PASSWORD:+evolution:}${EVOLUTION_DB_PASSWORD:-librefunnel:${POSTGRES_PASSWORD}}@db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: librefunnel
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: LibreFunnel
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy

  updater:
    logging: *logging
    # Pinned like the app's image: it is the one service with the Docker socket.
    image: ghcr.io/toledosdl/librefunnel-updater:${LIBREFUNNEL_VERSION:-latest}${LIBREFUNNEL_UPDATER_DIGEST:+@}${LIBREFUNNEL_UPDATER_DIGEST:-}
    # 0 when the installer was told --no-updater: updates are then the installer run again.
    scale: ${INSTALL_UPDATER:-1}
    build:
      context: .
      dockerfile: deploy/Dockerfile.updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-${POSTGRES_PASSWORD}}
      TZ: America/Sao_Paulo
      # Same project name as on the host, so compose inside drives the same containers and volumes.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    # It only recreates the app, starts or stops Evolution and runs the backup, which use no host paths, so a fixed folder works on any OS.
    working_dir: /srv/librefunnel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/srv/librefunnel

# Without IPv6 here Docker relays IPv6 visitors through its own proxy and all of them reach Caddy from one private
# address. The installer turns it on where the server has IPv6 and Docker 27 or later, which picks the subnet itself.
networks:
  default:
    enable_ipv6: ${INSTALL_IPV6:-false}

volumes:
  data:
  postgres:
  backups:
  caddy_data:
  caddy_config:
  evolution_instances:
