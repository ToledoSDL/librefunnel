    <radialGradient id="c-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#0a2a1f"/>
