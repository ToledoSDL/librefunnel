  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="400" y="352" font-size="46" font-weight="700" letter-spacing="-1" fill="#fff">Método Demo:</text>
    <text x="400" y="396" font-size="27" font-weight="500" fill="#a7e8c4">do zero à primeira venda</text>
