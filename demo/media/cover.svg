  <circle cx="400" cy="170" r="190" fill="url(#c-glow)"/>
  <circle cx="400" cy="170" r="108" fill="none" stroke="#4ade80" stroke-opacity=".24" stroke-width="2"/>
  <circle cx="400" cy="170" r="146" fill="none" stroke="#4ade80" stroke-opacity=".14" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
